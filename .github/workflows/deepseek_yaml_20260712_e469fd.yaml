name: Fetch Trending Products

on:
  schedule:
    - cron: "0 18 3 * *"
  workflow_dispatch:
    inputs:
      refresh_amazon:
        description: "Refresh Amazon/Lens monthly cache?"
        required: true
        default: "true"
        type: choice
        options:
          - "false"
          - "true"
      # NEW: Option to run only Google Trends (skip CJ, AliExpress, Amazon)
      run_google_trends_only:
        description: "Run only Google Trends (use existing products.json)?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

concurrency:
  group: droptrend-fetch-products
  cancel-in-progress: false

jobs:
  # Skip these if run_google_trends_only == true
  fetch-cj:
    if: github.event_name != 'workflow_dispatch' || inputs.run_google_trends_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # ... steps as before ...

  fetch-aliexpress:
    if: github.event_name != 'workflow_dispatch' || inputs.run_google_trends_only != 'true'
    needs: fetch-cj
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # ... steps as before ...

  merge-sources:
    if: github.event_name != 'workflow_dispatch' || inputs.run_google_trends_only != 'true'
    needs:
      - fetch-cj
      - fetch-aliexpress
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ... steps as before ...

  google-trends:
    needs: merge-sources  # Still declared, but we'll conditionally download artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - start: 0
            limit: 300
            name: google-trends-0
          - start: 300
            limit: 300
            name: google-trends-300
          - start: 600
            limit: 300
            name: google-trends-600
          - start: 900
            limit: 300
            name: google-trends-900
          - start: 1200
            limit: 300
            name: google-trends-1200

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # NEW: If we are running only Google Trends, we already have products.json in the repo.
      #       So we skip downloading the source-products artifact.
      - name: Download source products (if not running only Google Trends)
        if: github.event_name != 'workflow_dispatch' || inputs.run_google_trends_only != 'true'
        uses: actions/download-artifact@v4
        with:
          name: source-products
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm install --no-package-lock --registry https://registry.npmjs.org/ --no-audit --no-fund --legacy-peer-deps && break || sleep 15
          done
        env:
          NPM_CONFIG_FETCH_RETRIES: 10
          NPM_CONFIG_FETCH_TIMEOUT: 600000
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 30000
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch Google Trends chunk
        run: node scripts/fetch-google-trends.js
        env:
          GOOGLE_TRENDS_KEYWORD_POOL_LIMIT: 1500
          GOOGLE_TRENDS_START_INDEX: ${{ matrix.start }}
          GOOGLE_TRENDS_LIMIT: ${{ matrix.limit }}
          GOOGLE_TRENDS_CHUNK_START: ${{ matrix.start }}
          GOOGLE_TRENDS_CHUNK_SIZE: ${{ matrix.limit }}
          GOOGLE_TRENDS_GEO: ""
          GOOGLE_TRENDS_DATE: "today 3-m"
          GOOGLE_TRENDS_MAX_VARIANTS: 0
          GOOGLE_TRENDS_VARIANT_CONCURRENCY: 6

      - name: Rename Google Trends output files
        run: |
          mkdir -p google-trends-chunk
          [ -f google-trends.json ] && mv google-trends.json google-trends-chunk/google-trends-${{ matrix.start }}.json || true
          [ -f trend-keywords.json ] && mv trend-keywords.json google-trends-chunk/trend-keywords-${{ matrix.start }}.json || true
          [ -f google-trends-meta.json ] && mv google-trends-meta.json google-trends-chunk/google-trends-meta-${{ matrix.start }}.json || true

      - name: Upload Google Trends chunk
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: google-trends-chunk/

  amazon-lens:
    if: github.event_name != 'workflow_dispatch' || inputs.run_google_trends_only != 'true'
    needs: merge-sources
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - start: 0
            limit: 200
            name: amazon-lens-0
          # ... (rest of matrix)
    steps:
      # ... same as before ...

  merge:
    needs:
      - merge-sources
      - google-trends
      - amazon-lens
    # NEW: Always run, even if amazon-lens was skipped, because we still need to combine Google Trends data.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download source products
        # Only needed if we are not running only Google Trends (since we already have them from repo)
        if: github.event_name != 'workflow_dispatch' || inputs.run_google_trends_only != 'true'
        uses: actions/download-artifact@v4
        with:
          name: source-products
          path: .

      - name: Download Google Trends chunks
        uses: actions/download-artifact@v4
        with:
          pattern: google-trends-*
          path: google-trends-artifacts
          merge-multiple: true

      # NEW: Only download Amazon Lens chunks if they were generated (i.e., not skipped)
      - name: Download Amazon Lens chunks (if not running only Google Trends)
        if: github.event_name != 'workflow_dispatch' || inputs.run_google_trends_only != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: amazon-lens-*
          path: amazon-lens-artifacts
          merge-multiple: true

      - name: Combine Google Trends chunks
        run: |
          # ... (unchanged script) ...

      # NEW: Combine Amazon Lens chunks only if they exist
      - name: Combine Amazon Lens chunks
        if: github.event_name != 'workflow_dispatch' || inputs.run_google_trends_only != 'true'
        env:
          RESET_AMAZON_CACHE: ${{ github.event_name == 'schedule' || inputs.refresh_amazon == 'true' }}
        run: |
          # ... (unchanged script) ...

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm install --no-package-lock --registry https://registry.npmjs.org/ --no-audit --no-fund --legacy-peer-deps && break || sleep 15
          done
        env:
          NPM_CONFIG_FETCH_RETRIES: 10
          NPM_CONFIG_FETCH_TIMEOUT: 600000
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 30000
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000

      - name: Merge Trend Signals
        run: node scripts/merge-trend-signals.js

      - name: Commit Results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git stash push -u -m "generated-trend-results" || true
          git pull --rebase origin main || true
          git stash pop || true

          for file in \
            products.json \
            source-products-meta.json \
            cj-products.json \
            cj-products-meta.json \
            aliexpress-products.json \
            aliexpress-meta.json \
            aliexpress-keywords.json \
            google-trends.json \
            trend-keywords.json \
            google-trends-meta.json \
            trend-history.json \
            amazon-products.json \
            lens-amazon-matches.json \
            lens-amazon-failures.json \
            lens-amazon-meta.json \
            lens-provider-usage.json
          do
            [ -f "$file" ] && git add "$file"
          done

          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update trending products"
          git push || {
            git pull --rebase origin main
            git push
          }