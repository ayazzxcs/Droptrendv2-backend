name: Fetch Trending Products

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-products:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Install Puppeteer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1

      - name: Fetch CJ Trending Products
        run: node scripts/fetch-cj-products.js
        env:
          CJ_EMAIL: ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}

      - name: Fetch Google Trends
        run: node scripts/fetch-google-trends.js
        env:
          GOOGLE_TRENDS_LIMIT: 2

      - name: Fetch Monthly Lens Amazon Matches
        run: node scripts/fetch-monthly-lens-amazon-matches.js
        env:
          MONTHLY_LENS_MAX_PRODUCTS: 50
          MONTHLY_LENS_START_INDEX: 0
          MONTHLY_LENS_DELAY_MS: 1200
          AMAZON_PAGE_DELAY_MS: 3500
          AMAZON_MIN_TITLE_MATCH: 15

          SERPAPI_KEY_1: ${{ secrets.SERPAPI_KEY_1 }}
          SERPAPI_KEY_2: ${{ secrets.SERPAPI_KEY_2 }}
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          HASDATA_API_KEY: ${{ secrets.HASDATA_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          DECODO_AUTH_BASE64: ${{ secrets.DECODO_AUTH_BASE64 }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          OPENWEBNINJA_API_KEY: ${{ secrets.OPENWEBNINJA_API_KEY }}
          ZENSERP_API_KEY: ${{ secrets.ZENSERP_API_KEY }}

      - name: Merge Trend Signals
        run: node scripts/merge-trend-signals.js

      - name: Commit Results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Update trending products" || echo "No changes"
          git push
