name: Fetch Trending Products

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: droptrend-fetch-products
  cancel-in-progress: false

jobs:
  fetch-cj:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch CJ Trending Products
        run: node scripts/fetch-cj-products.js
        env:
          CJ_EMAIL: ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}

          CJ_REQUEST_INTERVAL_MS: 2500
          CJ_RETRIES: 8
          CJ_RETRY_BASE_MS: 6000
          CJ_TIMEOUT_MS: 60000

          CJ_TRENDING_PAGES: 10
          CJ_NORMAL_PAGES: 30
          CJ_MIN_PRODUCTS: 500
          CJ_MAX_PRODUCTS: 1500

      - name: Upload CJ products
        uses: actions/upload-artifact@v4
        with:
          name: cj-products
          path: products.json

  google-trends:
    needs: fetch-cj
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CJ products
        uses: actions/download-artifact@v4
        with:
          name: cj-products
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch Google Trends for all products
        run: node scripts/fetch-google-trends.js
        env:
          GOOGLE_TRENDS_START_INDEX: 0
          GOOGLE_TRENDS_LIMIT: 1500

      - name: Upload Google Trends files
        uses: actions/upload-artifact@v4
        with:
          name: google-trends
          path: |
            google-trends.json
            trend-keywords.json
            google-trends-meta.json

  amazon-lens:
    needs: fetch-cj
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CJ products
        uses: actions/download-artifact@v4
        with:
          name: cj-products
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Fetch Monthly Lens Amazon Matches for all products
        run: node scripts/fetch-monthly-lens-amazon-matches.js
        env:
          MONTHLY_LENS_START_INDEX: 0
          MONTHLY_LENS_MAX_PRODUCTS: 1500
          MONTHLY_LENS_DELAY_MS: 1500
          AMAZON_PAGE_DELAY_MS: 4500
          AMAZON_MIN_TITLE_MATCH: 15

          SERPAPI_KEY_1: ${{ secrets.SERPAPI_KEY_1 }}
          SERPAPI_KEY_2: ${{ secrets.SERPAPI_KEY_2 }}
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          DECODO_AUTH_BASE64: ${{ secrets.DECODO_AUTH_BASE64 }}
          DECODO_2_AUTH_BASE64: ${{ secrets.DECODO_2_AUTH_BASE64 }}

      - name: Upload Amazon Lens files
        uses: actions/upload-artifact@v4
        with:
          name: amazon-lens
          path: |
            amazon-products.json
            lens-amazon-matches.json
            lens-amazon-failures.json
            lens-amazon-meta.json
            lens-provider-usage.json

  merge:
    needs:
      - fetch-cj
      - google-trends
      - amazon-lens
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CJ products
        uses: actions/download-artifact@v4
        with:
          name: cj-products
          path: .

      - name: Download Google Trends files
        uses: actions/download-artifact@v4
        with:
          name: google-trends
          path: .

      - name: Download Amazon Lens files
        uses: actions/download-artifact@v4
        with:
          name: amazon-lens
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Merge Trend Signals
        run: node scripts/merge-trend-signals.js

      - name: Commit Results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Update trending products" || echo "No changes"
          git push
