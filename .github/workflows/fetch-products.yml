name: Fetch Trending Products

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-products:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund --fetch-retries=5 --fetch-retry-maxtimeout=120000

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch CJ Trending Products
        run: node scripts/fetch-cj-products.js
        env:
          CJ_EMAIL: ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}

      - name: Fetch Google Trends
        run: node scripts/fetch-google-trends.js
        env:
          GOOGLE_TRENDS_LIMIT: 10

      - name: Merge Trend Signals
        run: node scripts/merge-trend-signals.js

      - name: Fetch Google Lens Amazon Matches
        run: node scripts/fetch-lens-amazon-matches.js
        env:
          LENS_MAX_PRODUCTS: 1500
          LENS_MIN_DELAY_MS: 15000
          LENS_MAX_DELAY_MS: 45000
          LENS_MAX_AMAZON_MATCHES: 3
          LENS_MIN_TITLE_MATCH: 25
          AMAZON_DOMAIN: amazon.com

      
      
      - name: Commit Updated Products
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add products.json google-trends.json amazon-products.json trend-keywords.json amazon-keywords.json
          git commit -m "Update trending products" || echo "No changes"
          git push
