name: Fetch Trending Products

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-cj:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Fetch CJ Trending Products
        run: node scripts/fetch-cj-products.js
        env:
          CJ_EMAIL: ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: cj-products
          path: products.json

  google-trends:
    needs: fetch-cj
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cj-products
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch Google Trends
        run: node scripts/fetch-google-trends.js
        env:
          GOOGLE_TRENDS_LIMIT: 500

      - uses: actions/upload-artifact@v4
        with:
          name: google-trends
          path: |
            google-trends.json
            trend-keywords.json

  amazon-lens:
    needs: fetch-cj
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cj-products
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Fetch Monthly Lens Amazon Matches
        run: node scripts/fetch-monthly-lens-amazon-matches.js
        env:
          MONTHLY_LENS_MAX_PRODUCTS: 1000
          MONTHLY_LENS_START_INDEX: 0
          MONTHLY_LENS_DELAY_MS: 1200
          AMAZON_PAGE_DELAY_MS: 3500
          AMAZON_MIN_TITLE_MATCH: 15

          SERPAPI_KEY_1: ${{ secrets.SERPAPI_KEY_1 }}
          SERPAPI_KEY_2: ${{ secrets.SERPAPI_KEY_2 }}
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          DECODO_AUTH_BASE64: ${{ secrets.DECODO_AUTH_BASE64 }}
          DECODO_2_AUTH_BASE64 : ${{ secrets.DECODO_2_AUTH_BASE64 }}
          

      - uses: actions/upload-artifact@v4
        with:
          name: amazon-lens
          path: |
            amazon-products.json
            lens-amazon-matches.json
            lens-amazon-failures.json
            lens-amazon-meta.json
            lens-provider-usage.json

  merge:
    needs:
      - fetch-cj
      - google-trends
      - amazon-lens
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cj-products
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: google-trends
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: amazon-lens
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Merge Trend Signals
        run: node scripts/merge-trend-signals.js

      - name: Commit Results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Update trending products" || echo "No changes"
          git push
