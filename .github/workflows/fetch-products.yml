name: Fetch Trending Products

on:
  schedule:
    - cron: "0 18 3 * *"
  workflow_dispatch:
    inputs:
      refresh_amazon:
        description: "Refresh Amazon/Lens monthly cache?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: droptrend-fetch-products
  cancel-in-progress: false

jobs:
  fetch-cj:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch CJ Trending Products
        run: node scripts/fetch-cj-products.js
        env:
          CJ_EMAIL: ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}

          CJ_REQUEST_INTERVAL_MS: 2500
          CJ_RETRIES: 8
          CJ_RETRY_BASE_MS: 6000
          CJ_TIMEOUT_MS: 60000

          CJ_TRENDING_PAGES: 10
          CJ_NORMAL_PAGES: 30
          CJ_MIN_PRODUCTS: 500
          CJ_MAX_PRODUCTS: 1500

      - name: Upload CJ products
        uses: actions/upload-artifact@v4
        with:
          name: cj-products
          path: |
            cj-products.json
            cj-products-meta.json
            products.json
            cj-sample-product.json

  fetch-aliexpress:
    needs: fetch-cj
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CJ products
        uses: actions/download-artifact@v4
        with:
          name: cj-products
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Fetch AliExpress source products
        run: node scripts/fetch-aliexpress-products.js
        env:
          ALIEXPRESS_MAX_PRODUCTS: 1000
          ALIEXPRESS_MAX_SEARCHES: 90
          ALIEXPRESS_PRODUCTS_PER_KEYWORD: 24
          ALIEXPRESS_MIN_PRODUCTS_PER_KEYWORD: 12
          ALIEXPRESS_DELAY_MS: 2500
          ALIEXPRESS_TIMEOUT_MS: 60000
          ALIEXPRESS_SESSION_KEYWORD_BATCH_SIZE: 0

          ALIEXPRESS_DISCOVER_KEYWORDS: "true"
          ALIEXPRESS_DISCOVERY_CANDIDATE_LIMIT: 140
          ALIEXPRESS_DISCOVERY_VALIDATION_LIMIT: 70
          ALIEXPRESS_DISCOVERY_MIN_PRODUCTS: 8

          ALIEXPRESS_STATIC_FALLBACK_ON_DISCOVERY_FAIL: "false"

          ALIEXPRESS_DISCOVERY_IMMEDIATE_PROBE_RETRIES: 1
          ALIEXPRESS_DISCOVERY_DEFERRED_PROBE_RETRIES: 3
          ALIEXPRESS_DISCOVERY_PROBE_EMPTY_RESET_STREAK: 3
          ALIEXPRESS_DISCOVERY_DEFERRED_RETRY_LIMIT: 70

          ALIEXPRESS_FALLBACK_CACHE: "true"

      - name: Upload AliExpress products
        uses: actions/upload-artifact@v4
        with:
          name: aliexpress-products
          path: |
            aliexpress-products.json
            aliexpress-meta.json
            aliexpress-keywords.json

  merge-sources:
    needs:
      - fetch-cj
      - fetch-aliexpress
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CJ products
        uses: actions/download-artifact@v4
        with:
          name: cj-products
          path: .

      - name: Download AliExpress products
        uses: actions/download-artifact@v4
        with:
          name: aliexpress-products
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Merge CJ + AliExpress source products
        run: node scripts/merge-source-products.js
        env:
          CJ_SOURCE_TARGET: 750
          ALIEXPRESS_SOURCE_TARGET: 750
          FINAL_MAX_PRODUCTS: 1500

      - name: Upload merged source products
        uses: actions/upload-artifact@v4
        with:
          name: source-products
          path: |
            products.json
            source-products-meta.json
            cj-products.json
            cj-products-meta.json
            aliexpress-products.json
            aliexpress-meta.json
            aliexpress-keywords.json

  google-trends:
    needs: merge-sources
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - start: 0
            limit: 300
            name: google-trends-0
          - start: 300
            limit: 300
            name: google-trends-300
          - start: 600
            limit: 300
            name: google-trends-600
          - start: 900
            limit: 300
            name: google-trends-900
          - start: 1200
            limit: 300
            name: google-trends-1200

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download source products
        uses: actions/download-artifact@v4
        with:
          name: source-products
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch Google Trends chunk
        run: node scripts/fetch-google-trends.js
        env:
          GOOGLE_TRENDS_KEYWORD_POOL_LIMIT: 1500

          GOOGLE_TRENDS_START_INDEX: ${{ matrix.start }}
          GOOGLE_TRENDS_LIMIT: ${{ matrix.limit }}

          GOOGLE_TRENDS_CHUNK_START: ${{ matrix.start }}
          GOOGLE_TRENDS_CHUNK_SIZE: ${{ matrix.limit }}

          GOOGLE_TRENDS_GEO: ""
          GOOGLE_TRENDS_DATE: "today 3-m"
          GOOGLE_TRENDS_MAX_VARIANTS: 3

      - name: Rename Google Trends output files
        run: |
          mkdir -p google-trends-chunk

          [ -f google-trends.json ] && mv google-trends.json google-trends-chunk/google-trends-${{ matrix.start }}.json || true
          [ -f trend-keywords.json ] && mv trend-keywords.json google-trends-chunk/trend-keywords-${{ matrix.start }}.json || true
          [ -f google-trends-meta.json ] && mv google-trends-meta.json google-trends-chunk/google-trends-meta-${{ matrix.start }}.json || true

      - name: Upload Google Trends chunk
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: google-trends-chunk/

  amazon-lens:
    needs: merge-sources
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - start: 0
            limit: 300
            name: amazon-lens-0
          - start: 300
            limit: 300
            name: amazon-lens-300
          - start: 600
            limit: 300
            name: amazon-lens-600
          - start: 900
            limit: 300
            name: amazon-lens-900
          - start: 1200
            limit: 300
            name: amazon-lens-1200

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download source products
        uses: actions/download-artifact@v4
        with:
          name: source-products
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Fetch Monthly Lens Amazon Matches chunk
        run: node scripts/fetch-monthly-lens-amazon-matches.js
        env:
          RESET_AMAZON_CACHE: ${{ github.event_name == 'schedule' || inputs.refresh_amazon == 'true' }}

          MONTHLY_LENS_START_INDEX: ${{ matrix.start }}
          MONTHLY_LENS_MAX_PRODUCTS: ${{ matrix.limit }}

          MONTHLY_LENS_DELAY_MS: 1500
          AMAZON_PAGE_DELAY_MS: 4500
          AMAZON_MIN_TITLE_MATCH: 15
          AMAZON_CANDIDATE_LIMIT: 8

          SERPAPI_KEY_1: ${{ secrets.SERPAPI_KEY_1 }}
          SERPAPI_KEY_2: ${{ secrets.SERPAPI_KEY_2 }}
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          DECODO_AUTH_BASE64: ${{ secrets.DECODO_AUTH_BASE64 }}
          DECODO_2_AUTH_BASE64: ${{ secrets.DECODO_2_AUTH_BASE64 }}

      - name: Rename Amazon output files
        run: |
          mkdir -p amazon-lens-chunk

          [ -f amazon-products.json ] && mv amazon-products.json amazon-lens-chunk/amazon-products-${{ matrix.start }}.json || true
          [ -f lens-amazon-matches.json ] && mv lens-amazon-matches.json amazon-lens-chunk/lens-amazon-matches-${{ matrix.start }}.json || true
          [ -f lens-amazon-failures.json ] && mv lens-amazon-failures.json amazon-lens-chunk/lens-amazon-failures-${{ matrix.start }}.json || true
          [ -f lens-amazon-meta.json ] && mv lens-amazon-meta.json amazon-lens-chunk/lens-amazon-meta-${{ matrix.start }}.json || true
          [ -f lens-provider-usage.json ] && mv lens-provider-usage.json amazon-lens-chunk/lens-provider-usage-${{ matrix.start }}.json || true

      - name: Upload Amazon Lens chunk
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: amazon-lens-chunk/

  merge:
    needs:
      - merge-sources
      - google-trends
      - amazon-lens
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download source products
        uses: actions/download-artifact@v4
        with:
          name: source-products
          path: .

      - name: Download Google Trends chunks
        uses: actions/download-artifact@v4
        with:
          pattern: google-trends-*
          path: google-trends-artifacts
          merge-multiple: true

      - name: Download Amazon Lens chunks
        uses: actions/download-artifact@v4
        with:
          pattern: amazon-lens-*
          path: amazon-lens-artifacts
          merge-multiple: true

      - name: Combine Google Trends chunks
        run: |
          node - <<'NODE'
          const fs = require('fs');

          function readJson(file, fallback) {
            try {
              return JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch {
              return fallback;
            }
          }

          function getStartNumber(file) {
            return Number(file.match(/-(\d+)\.json$/)?.[1] || 0);
          }

          function mergeArrayFiles(dir, pattern, outFile) {
            const files = fs.existsSync(dir)
              ? fs.readdirSync(dir)
                  .filter((f) => pattern.test(f))
                  .sort((a, b) => getStartNumber(a) - getStartNumber(b))
                  .map((f) => `${dir}/${f}`)
              : [];

            const merged = [];

            for (const file of files) {
              const data = readJson(file, []);

              if (Array.isArray(data)) {
                merged.push(...data);
              } else if (Array.isArray(data.products)) {
                merged.push(...data.products);
              } else if (Array.isArray(data.items)) {
                merged.push(...data.items);
              } else if (data && typeof data === 'object') {
                merged.push(data);
              }
            }

            fs.writeFileSync(outFile, JSON.stringify(merged, null, 2));
            console.log(`Wrote ${outFile}: ${merged.length} records from ${files.length} files`);
          }

          function mergeObjectFiles(dir, pattern, outFile) {
            const files = fs.existsSync(dir)
              ? fs.readdirSync(dir)
                  .filter((f) => pattern.test(f))
                  .sort((a, b) => getStartNumber(a) - getStartNumber(b))
                  .map((f) => `${dir}/${f}`)
              : [];

            const merged = {};

            for (const file of files) {
              const data = readJson(file, {});

              if (data && typeof data === 'object' && !Array.isArray(data)) {
                Object.assign(merged, data);
              }
            }

            fs.writeFileSync(outFile, JSON.stringify(merged, null, 2));
            console.log(`Wrote ${outFile} from ${files.length} files`);
          }

          mergeArrayFiles(
            'google-trends-artifacts',
            /^google-trends-\d+\.json$/,
            'google-trends.json'
          );

          mergeArrayFiles(
            'google-trends-artifacts',
            /^trend-keywords-\d+\.json$/,
            'trend-keywords.json'
          );

          mergeObjectFiles(
            'google-trends-artifacts',
            /^google-trends-meta-\d+\.json$/,
            'google-trends-meta.json'
          );
          NODE

      - name: Combine Amazon Lens chunks
        env:
          RESET_AMAZON_CACHE: ${{ github.event_name == 'schedule' || inputs.refresh_amazon == 'true' }}
        run: |
          node - <<'NODE'
          const fs = require('fs');

          function readJson(file, fallback) {
            try {
              return JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch {
              return fallback;
            }
          }

          function num(v) {
            const n = Number(v);
            return Number.isFinite(n) ? n : 0;
          }

          function getStartNumber(file) {
            return Number(file.match(/-(\d+)\.json$/)?.[1] || 0);
          }

          function cleanKey(value) {
            return String(value || "")
              .toLowerCase()
              .replace(/https?:\/\//g, "")
              .replace(/[?#].*$/g, "")
              .replace(/[^a-z0-9]+/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function amazonKey(a) {
            const productId = cleanKey(a.productId || a.cjProductId || a.sourceProductId || a.id);
            if (productId) return `product:${productId}`;

            const productName = cleanKey(a.productName || a.cjProductName || a.originalProductName || a.keyword);
            if (productName) return `name:${productName}`;

            const productUrl = cleanKey(a.productUrl || a.url || a.amazonUrl);
            if (productUrl) return `url:${productUrl}`;

            const title = cleanKey(a.title || a.amazonTitle);
            if (title) return `title:${title}`;

            return "";
          }

          function quality(a) {
            return (
              num(a.score) * 1000 +
              num(a.matchScore) * 20 +
              num(a.bestRating) * 20 +
              Math.log10(num(a.bestRatingsTotal) + 1) * 60 +
              (a.productUrl || a.url || a.amazonUrl ? 30 : 0) +
              (a.asin ? 30 : 0) +
              (a.isBestSeller ? 40 : 0)
            );
          }

          function putBest(map, item) {
            const key = amazonKey(item);
            if (!key) return;

            const prev = map.get(key);
            if (!prev || quality(item) > quality(prev)) {
              map.set(key, item);
            }
          }

          function arrayFiles(dir, pattern) {
            return fs.existsSync(dir)
              ? fs.readdirSync(dir)
                  .filter((f) => pattern.test(f))
                  .sort((a, b) => getStartNumber(a) - getStartNumber(b))
                  .map((f) => `${dir}/${f}`)
              : [];
          }

          function mergeArrayFiles(dir, pattern, outFile) {
            const files = arrayFiles(dir, pattern);
            const merged = [];

            for (const file of files) {
              const data = readJson(file, []);

              if (Array.isArray(data)) {
                merged.push(...data);
              } else if (Array.isArray(data.products)) {
                merged.push(...data.products);
              } else if (Array.isArray(data.matches)) {
                merged.push(...data.matches);
              } else if (Array.isArray(data.items)) {
                merged.push(...data.items);
              } else if (data && typeof data === 'object') {
                merged.push(data);
              }
            }

            fs.writeFileSync(outFile, JSON.stringify(merged, null, 2));
            console.log(`Wrote ${outFile}: ${merged.length} records from ${files.length} files`);
            return merged;
          }

          function mergeObjectFiles(dir, pattern, outFile) {
            const files = arrayFiles(dir, pattern);
            const merged = {};

            for (const file of files) {
              const data = readJson(file, {});

              if (data && typeof data === 'object' && !Array.isArray(data)) {
                Object.assign(merged, data);
              }
            }

            fs.writeFileSync(outFile, JSON.stringify(merged, null, 2));
            console.log(`Wrote ${outFile} from ${files.length} files`);
          }

          const resetAmazon = /^(1|true|yes)$/i.test(String(process.env.RESET_AMAZON_CACHE || "false"));

          const previousCache = resetAmazon ? [] : readJson('amazon-products.json', []);
          const cacheMap = new Map();

          for (const item of Array.isArray(previousCache) ? previousCache : []) {
            putBest(cacheMap, item);
          }

          const beforeCount = cacheMap.size;
          const chunkRecords = mergeArrayFiles(
            'amazon-lens-artifacts',
            /^amazon-products-\d+\.json$/,
            'amazon-products-new-chunks.json'
          );

          for (const item of chunkRecords) {
            putBest(cacheMap, item);
          }

          const finalAmazon = [...cacheMap.values()];
          fs.writeFileSync('amazon-products.json', JSON.stringify(finalAmazon, null, 2));

          console.log(
            `Amazon cache ${resetAmazon ? "RESET" : "KEPT"}: ` +
            `${beforeCount} existing + ${chunkRecords.length} new chunk records -> ${finalAmazon.length} deduped records`
          );

          mergeArrayFiles(
            'amazon-lens-artifacts',
            /^lens-amazon-matches-\d+\.json$/,
            'lens-amazon-matches.json'
          );

          mergeArrayFiles(
            'amazon-lens-artifacts',
            /^lens-amazon-failures-\d+\.json$/,
            'lens-amazon-failures.json'
          );

          mergeObjectFiles(
            'amazon-lens-artifacts',
            /^lens-amazon-meta-\d+\.json$/,
            'lens-amazon-meta.json'
          );

          mergeObjectFiles(
            'amazon-lens-artifacts',
            /^lens-provider-usage-\d+\.json$/,
            'lens-provider-usage.json'
          );
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Merge Trend Signals
        run: node scripts/merge-trend-signals.js

      - name: Commit Results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git stash push -u -m "generated-trend-results" || true

          git pull --rebase origin main || true

          git stash pop || true

          for file in \
            products.json \
            source-products-meta.json \
            cj-products.json \
            cj-products-meta.json \
            aliexpress-products.json \
            aliexpress-meta.json \
            aliexpress-keywords.json \
            google-trends.json \
            trend-keywords.json \
            google-trends-meta.json \
            trend-history.json \
            amazon-products.json \
            lens-amazon-matches.json \
            lens-amazon-failures.json \
            lens-amazon-meta.json \
            lens-provider-usage.json
          do
            [ -f "$file" ] && git add "$file"
          done

          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "Update trending products"

          git push || {
            git pull --rebase origin main
            git push
          }
